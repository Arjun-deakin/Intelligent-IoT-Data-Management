global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:3000

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: docker_service_exporter
    static_configs:
      - targets:
          - docker-service-exporter:9104

  - job_name: correlation_alert
    metrics_path: /metrics
    static_configs:
      - targets:
          - correlation-alert:5001

  - job_name: archived_analytics
    metrics_path: /metrics
    static_configs:
      - targets:
          - archived-analytics:5000
