global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000

  - job_name: analytics_integration
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:5002

  - job_name: docker_service_exporter
    static_configs:
      - targets:
          - host.docker.internal:9104
