groups:
  - name: engineering-analytics-alerts
    rules:
      - alert: BackendUnavailable
        expr: avg(up{job="backend"}) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Backend API unavailable
          description: Backend scrape target is down.

      - alert: HighApiP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(iot_http_request_duration_seconds_bucket[5m]))) > 0.6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency is elevated
          description: p95 latency has exceeded 600ms for 5 minutes.

      - alert: FrontendRouteMismatchDetected
        expr: iot_frontend_route_mismatch_total > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Frontend route mismatch detected
          description: The frontend has reported calls to a missing or mismatched route.

      - alert: ThingSpeakPollingFailures
        expr: increase(iot_thingspeak_polls_total{status="error"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: ThingSpeak polling failure detected
          description: ThingSpeak polling returned at least one error in the last 15 minutes.

      - alert: DatabaseUnhealthy
        expr: iot_db_health_status < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Database connectivity unhealthy
          description: The backend reported PostgreSQL connectivity failure.
